<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>재고현황 대시보드 | 스타스테크</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f0f4f9;--surface:#fff;--s2:#f5f7fb;--s3:#edf0f7;
  --border:#e4e9f2;--border2:#d0d9ea;
  --tp:#1a2436;--ts:#586880;--tm:#96a5bb;
  --acc:#2563eb;--accl:#dbeafe;--acch:#1d4ed8;
  --grn:#16a34a;--grnl:#dcfce7;
  --red:#dc2626;--redl:#fee2e2;
  --amber:#d97706;--ambl:#fef3c7;
  --pur:#7c3aed;--purl:#ede9fe;
  --sh0:0 1px 3px rgba(0,0,0,.06);
  --sh1:0 2px 8px rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.04);
  --sh2:0 6px 20px rgba(0,0,0,.09),0 2px 8px rgba(0,0,0,.05);
  --r:12px;--rsm:8px;--rlg:16px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--tp);min-height:100vh;font-size:13px;}

/* ─ HEADER ─ */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;box-shadow:var(--sh0);position:sticky;top:0;z-index:300;}
.hdr-in{display:flex;align-items:center;gap:14px;height:54px;max-width:1600px;margin:0 auto;}
.logo{display:flex;align-items:center;gap:7px;background:var(--acc);color:#fff;padding:5px 12px;border-radius:var(--rsm);font-weight:700;font-size:11px;letter-spacing:.05em;}
.logo svg{width:14px;height:14px;}
.htitle{font-size:15px;font-weight:700;}
.metas{display:flex;gap:7px;}
.mc{background:var(--s2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:11.5px;color:var(--ts);font-weight:500;}
.hsp{flex:1;}
.tabs{display:flex;background:var(--s3);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;gap:0;}
.tab{padding:7px 18px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ts);background:transparent;border:none;font-family:'Noto Sans KR',sans-serif;white-space:nowrap;transition:all .15s;}
.tab.on{background:var(--acc);color:#fff;border-radius:calc(var(--r) - 1px);}
.btn-load{display:flex;align-items:center;gap:6px;background:var(--acc);color:#fff;border:none;padding:7px 14px;border-radius:var(--rsm);font-size:12px;font-weight:600;cursor:pointer;transition:background .13s;font-family:'Noto Sans KR',sans-serif;white-space:nowrap;}
.btn-load:hover{background:var(--acch);}
.btn-load svg{width:14px;height:14px;}

/* ─ MAIN ─ */
.main{max-width:1600px;margin:0 auto;padding:20px 28px 40px;}

/* ─ LOCATION SECTION ─ */
.section-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--rlg);padding:18px 20px;margin-bottom:18px;box-shadow:var(--sh0);}
.section-title{font-size:13px;font-weight:700;color:var(--ts);margin-bottom:14px;display:flex;align-items:center;gap:7px;}
.section-title svg{width:15px;height:15px;color:var(--acc);}

/* Location cards grid */
.loc-grid{display:flex;flex-wrap:wrap;gap:10px;}
.loc-card{display:flex;align-items:center;gap:10px;background:var(--s2);border:1.5px solid var(--border);border-radius:var(--r);padding:10px 16px;cursor:pointer;transition:all .15s;min-width:160px;user-select:none;}
.loc-card:hover{border-color:var(--acc);background:#eff6ff;box-shadow:var(--sh1);}
.loc-card.on{border-color:var(--acc);background:var(--accl);box-shadow:var(--sh1);}
.loc-card.all-card{border-style:dashed;min-width:90px;}
.loc-card.all-card.on{border-style:solid;}
.loc-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.loc-info{flex:1;min-width:0;}
.loc-name{font-size:13px;font-weight:700;color:var(--tp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.loc-cnt{font-size:11.5px;color:var(--tm);margin-top:1px;}
.loc-cnt strong{color:var(--acc);font-weight:600;}

/* ─ TOOLBAR ─ */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.sb{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--rsm);padding:6px 12px;min-width:200px;max-width:280px;}
.sb svg{width:13px;height:13px;color:var(--tm);flex-shrink:0;}
.sb input{border:none;outline:none;background:transparent;font-family:'Noto Sans KR',sans-serif;font-size:12.5px;color:var(--tp);width:100%;}
.sb input::placeholder{color:var(--tm);}
.sp{flex:1;}
.cbadge{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--ts);font-weight:500;}
.cbadge strong{color:var(--acc);}

/* ─ TABLE ─ */
.twrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--rlg);box-shadow:var(--sh0);overflow:auto;max-height:calc(100vh - 380px);}
table{width:100%;border-collapse:collapse;min-width:560px;}
thead{position:sticky;top:0;z-index:10;}
thead th{background:var(--s2);border-bottom:2px solid var(--border2);padding:10px 14px;font-size:11px;font-weight:700;color:var(--ts);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;cursor:pointer;user-select:none;transition:background .1s;}
thead th:hover{background:#e6ecf5;}
thead th.hl{background:#eff6ff!important;}
thead th:first-child{padding-left:20px;}
thead th.sa::after{content:' ↑';color:var(--acc);}
thead th.sd::after{content:' ↓';color:var(--acc);}
tbody tr{border-bottom:1px solid var(--border);transition:background .08s;}
tbody tr:hover{background:#f5f8fe;}
tbody tr:last-child{border-bottom:none;}
td{padding:9px 14px;font-size:12.5px;vertical-align:middle;}
td:first-child{padding-left:20px;color:var(--tm);font-size:11px;}
td.num,th.num{text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px;}
td.ctr,th.ctr{text-align:center;}
td.ed{cursor:text;}
td.ed:focus{outline:2px solid var(--acc);outline-offset:-2px;background:#fff;border-radius:3px;}
td.mod{background:#fef9c3!important;}
.neg{color:var(--red)!important;}
.pn{font-weight:500;color:var(--tp);}
.pb{font-size:11px;color:var(--tm);font-family:'JetBrains Mono',monospace;}
.chwh{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;background:var(--accl);color:var(--acc);}
.chloc{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;background:var(--s3);color:#475569;}

/* ─ PRODUCTION SECTION ─ */
.prod-header{display:flex;align-items:stretch;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.prod-main-card{background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 60%,#3b82f6 100%);color:#fff;border-radius:var(--rlg);padding:24px 28px;flex:1;min-width:260px;box-shadow:var(--sh2);position:relative;overflow:hidden;}
.prod-main-card::after{content:'⚙';position:absolute;right:-10px;bottom:-20px;font-size:80px;opacity:.1;}
.pmc-label{font-size:11.5px;font-weight:600;opacity:.8;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;}
.pmc-product{font-size:18px;font-weight:700;margin-bottom:14px;}
.pmc-qty{font-family:'JetBrains Mono',monospace;font-size:44px;font-weight:700;line-height:1;}
.pmc-unit{font-size:14px;opacity:.8;margin-top:4px;}
.pmc-sub{font-size:11.5px;opacity:.65;margin-top:8px;}
.pmc-badge{display:inline-block;background:rgba(255,255,255,.2);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;margin-top:10px;}

.prod-bttl{background:var(--surface);border:1px solid var(--border);border-radius:var(--rlg);padding:20px 22px;min-width:220px;max-width:280px;box-shadow:var(--sh0);}
.bttl-title{font-size:11px;font-weight:700;color:var(--ts);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
.bttl-name{font-size:13px;font-weight:700;color:var(--red);margin-bottom:4px;}
.bttl-pno{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--tm);margin-bottom:12px;}
.bttl-bar-wrap{background:var(--s3);border-radius:6px;height:8px;overflow:hidden;margin-bottom:6px;}
.bttl-bar{height:100%;background:var(--red);border-radius:6px;}
.bttl-stat{font-size:11px;color:var(--ts);}

/* BOM cards grid */
.bom-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.bom-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh0);transition:box-shadow .15s;position:relative;overflow:hidden;}
.bom-card:hover{box-shadow:var(--sh1);}
.bom-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;}
.bom-card.ok::before{background:var(--grn);}
.bom-card.warn::before{background:var(--amber);}
.bom-card.btl::before{background:var(--red);}
.bc-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
.bc-cat{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.04em;}
.bc-cat.원자재{background:#dbeafe;color:#1d4ed8;}
.bc-cat.중간재{background:#ede9fe;color:#6d28d9;}
.bc-cat.톤백{background:#d1fae5;color:#065f46;}
.bc-cat.LDPE{background:#fef3c7;color:#92400e;}
.bc-badge{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:10px;}
.bc-badge.ok{background:var(--grnl);color:var(--grn);}
.bc-badge.warn{background:var(--ambl);color:var(--amber);}
.bc-badge.btl{background:var(--redl);color:var(--red);}
.bc-pno{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--tm);margin-bottom:3px;}
.bc-name{font-size:13px;font-weight:600;color:var(--tp);margin-bottom:12px;line-height:1.4;}
.bc-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.bc-stat{text-align:center;}
.bc-stat-label{font-size:10px;color:var(--tm);text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px;}
.bc-stat-val{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--tp);}
.bc-stat-val.hi{color:var(--grn);}
.bc-stat-val.lo{color:var(--red);}
.bc-prog{margin-top:12px;}
.bc-prog-bar{background:var(--s3);border-radius:6px;height:6px;overflow:hidden;}
.bc-prog-fill{height:100%;border-radius:6px;transition:width .4s;}
.bc-prog-fill.ok{background:var(--grn);}
.bc-prog-fill.warn{background:var(--amber);}
.bc-prog-fill.btl{background:var(--red);}
.bc-prog-label{display:flex;justify-content:space-between;font-size:10px;color:var(--tm);margin-top:4px;}

/* ─ FOOTER ─ */
.fbar{background:var(--surface);border-top:1px solid var(--border);padding:8px 28px;display:flex;align-items:center;gap:14px;font-size:11.5px;color:var(--tm);position:sticky;bottom:0;z-index:50;}
.ftots{display:flex;gap:20px;margin-left:auto;}
.fi{display:flex;gap:6px;align-items:center;}
.fl{color:var(--tm);font-size:11.5px;}
.fv{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;color:var(--tp);}

/* ─ TOAST ─ */
.toast{position:fixed;bottom:20px;right:20px;background:#1e293b;color:#fff;padding:10px 16px;border-radius:var(--r);font-size:12.5px;font-weight:500;z-index:9999;transform:translateY(14px);opacity:0;transition:all .22s;pointer-events:none;}
.toast.on{transform:translateY(0);opacity:1;}
.toast.ok{background:var(--grn);} .toast.er{background:var(--red);}

.twrap::-webkit-scrollbar{width:5px;height:5px;}
.twrap::-webkit-scrollbar-track{background:transparent;}
.twrap::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* hide/show */
.view{display:none;} .view.on{display:block;}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-in">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      STARSTEC
    </div>
    <div class="htitle">재고현황 대시보드</div>
    <div class="metas">
      <span class="mc" id="mYear">2026년</span>
      <span class="mc" id="mComp">스타스테크</span>
    </div>
    <div class="hsp"></div>
    <div class="tabs">
      <button class="tab on" id="tab-inv" onclick="switchTab('inv')">📦 재고현황</button>
      <button class="tab" id="tab-prod" onclick="switchTab('prod')">⚙️ 생산예측</button>
    </div>
    <button class="btn-load" onclick="document.getElementById('fi').click()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      파일 불러오기
    </button>
    <input type="file" id="fi" accept=".xlsx,.xls" onchange="loadFile(event)" style="display:none">
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- ── 창고별 재고 조회 (always visible) ── -->
  <div class="section-box">
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
      창고별 재고 조회
    </div>
    <div class="loc-grid" id="locGrid"></div>
  </div>

  <!-- ── 재고현황 탭 ── -->
  <div class="view on" id="view-inv">
    <div class="toolbar">
      <div class="sb">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="sq" placeholder="품번, 품명 검색…" oninput="renderInv()">
      </div>
      <div class="sp"></div>
      <div class="cbadge"><strong id="vc">0</strong> / <span id="tc">0</span> 건</div>
    </div>
    <div class="twrap">
      <table><thead id="th"></thead><tbody id="tb"></tbody></table>
    </div>
  </div>

  <!-- ── 생산예측 탭 ── -->
  <div class="view" id="view-prod">
    <div class="prod-header" id="prodHeader"></div>
    <div class="bom-grid" id="bomGrid"></div>
  </div>

</div>

<!-- FOOTER -->
<div class="fbar">
  <span id="fbarLabel">셀 클릭으로 편집 가능 &nbsp;·&nbsp; 수정된 셀 <span style="background:#fef9c3;padding:1px 6px;border-radius:3px;">노란색</span></span>
  <div class="ftots" id="ftots">
    <div class="fi"><span class="fl">품목 수</span><span class="fv" id="ft-cnt">—</span></div>
    <div class="fi"><span class="fl">현재고 합계</span><span class="fv" id="ft-end">—</span></div>
  </div>
</div>

<div class="toast" id="toast"></div>

// ══ LOCATION GRID ══
function buildLocGrid(){
  const locs=[...new Set(D.map(r=>r['장소']))];
  const grid=document.getElementById('locGrid');
  let h='';

  // 전체
  const totCnt=D.filter(r=>r['기말재고']!==0).length;
  h+=`<div class="loc-card all-card${selLoc==='all'?' on':''}" onclick="selectLoc('all')">
    <div class="loc-icon" style="background:#e8f0fe;font-size:20px;">🏠</div>
    <div class="loc-info"><div class="loc-name">전 체</div>
    <div class="loc-cnt"><strong>${totCnt}</strong>종</div></div></div>`;

  locs.forEach(loc=>{
    const cnt=D.filter(r=>r['장소']===loc&&r['기말재고']!==0).length;
    if(!cnt) return;
    const ic=LOC_ICONS[loc]||{e:'📦',bg:'#f1f5f9',c:'#475569'};
    h+=`<div class="loc-card${selLoc===loc?' on':''}" onclick="selectLoc('${loc.replace(/'/g,"\\'")}')">
      <div class="loc-icon" style="background:${ic.bg}">${ic.e}</div>
      <div class="loc-info">
        <div class="loc-name">${loc}</div>
        <div class="loc-cnt"><strong>${cnt}</strong>종</div>
      </div></div>`;
  });
  grid.innerHTML=h;
}

function selectLoc(loc){
  selLoc=loc;
  buildLocGrid();
  renderInv();
  if(curTab==='prod') renderProd();
}

  const q=document.getElementById('sq').value.trim().toLowerCase();
  let rows=D.filter(r=>{
    if(selLoc!=='all'&&r['장소']!==selLoc) return false;
    if(!q) return true;
    return [r['품번'],r['품명'],r['장소']].some(v=>String(v).toLowerCase().includes(q));
  });

  // Sort
  if(sCol>=0){
    const ks=['장소','창고','품번','품명','재고단위','기말재고'];
    const k=ks[sCol-1]||ks[0];
    rows=[...rows].sort((a,b)=>{let va=a[k],vb=b[k];return(typeof va==='number'?(va-vb):String(va).localeCompare(String(vb),'ko'))*sDir;});
  }

  const showLoc=selLoc==='all';
  document.getElementById('th').innerHTML=`<tr>
    <th onclick="srt(0)" style="width:42px">No</th>
    ${showLoc?`<th onclick="srt(1)">창고</th><th onclick="srt(2)">장소</th>`:''}
    <th onclick="srt(${showLoc?3:1})">품번</th>
    <th onclick="srt(${showLoc?4:2})" style="min-width:200px">품명</th>
    <th onclick="srt(${showLoc?5:3})" class="ctr">재고단위</th>
    <th onclick="srt(${showLoc?6:4})" class="num hl" style="min-width:130px">현재고</th>
  </tr>`;

  const tb=document.getElementById('tb');
  tb.innerHTML='';
  rows.forEach((r,i)=>{
    const idx=D.indexOf(r);
    const neg=r['기말재고']<0;
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${i+1}</td>
      ${showLoc?`<td><span class="chwh">${r['창고']}</span></td><td><span class="chloc">${r['장소']}</span></td>`:''}
      <td class="pb">${r['품번']}</td>
      <td class="pn">${r['품명']}</td>
      <td class="ctr">${r['재고단위']}</td>
      <td class="num ed${neg?' neg':''}" data-idx="${idx}" style="background:${neg?'':'#f8faff'}">${fn(r['기말재고'])}</td>`;
    const editTd=tr.querySelector('td.ed');
    if(editTd){
      editTd.contentEditable=true;
      let pv;
      editTd.addEventListener('focus',()=>pv=editTd.textContent);
      editTd.addEventListener('blur',()=>{
        const n=parseFloat(editTd.textContent.replace(/,/g,''));
        if(isNaN(n)){editTd.textContent=pv;return;}
        D[idx]['기말재고']=n;
        editTd.textContent=fn(n);
        editTd.classList.toggle('neg',n<0);
        if(editTd.textContent!==pv){editTd.classList.add('mod');renderProd();}
      });
      editTd.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();editTd.blur();}if(e.key==='Escape'){editTd.textContent=pv;editTd.blur();}});
    }
    tb.appendChild(tr);
  });

  document.getElementById('vc').textContent=rows.length;
  document.getElementById('tc').textContent=D.length;
  const sum=rows.reduce((s,r)=>s+(r['기말재고']>0?r['기말재고']:0),0);
  document.getElementById('ft-cnt').textContent=rows.length;
  document.getElementById('ft-end').textContent=fn(Math.round(sum));
}

function srt(col){
  if(sCol===col)sDir*=-1;else{sCol=col;sDir=1;}
  document.querySelectorAll('thead th').forEach((th,i)=>{th.classList.remove('sa','sd');if(i===col)th.classList.add(sDir===1?'sa':'sd');});
  renderInv();
}

// ══ PRODUCTION TAB ══
function renderProd(){
  // Calculate stock per 품번 (all locations sum)
  const stockMap={};
  D.forEach(r=>{
    if(!stockMap[r['품번']]) stockMap[r['품번']]=0;
    stockMap[r['품번']]+=r['기말재고'];
  });

  // Per BOM item: max producible
  const maxProd=BOM.map(b=>{
    const stock=stockMap[b.품번]||0;
    const possible=b.qty>0?Math.floor(stock/b.qty):Infinity;
    return{...b,stock,possible};
  });

  const minPossible=Math.min(...maxProd.map(b=>b.possible));
  const bottleneck=maxProd.reduce((a,b)=>b.possible<a.possible?b:a);
  const maxPossible=Math.max(...maxProd.map(b=>b.possible));

  // Header
  document.getElementById('prodHeader').innerHTML=`
    <div class="prod-main-card">
      <div class="pmc-label">생산 예측 · ECO-ST2 1000kg</div>
      <div class="pmc-product">제)ECO-ST2_1000kg (1포대 = 1,000kg)</div>
      <div class="pmc-qty">${minPossible.toLocaleString()}</div>
      <div class="pmc-unit">포대 생산 가능</div>
      <div class="pmc-sub">현재고 기준 최대 생산량 (전체 재고 합산)</div>
      <div class="pmc-badge">병목자재 → ${bottleneck.품명.replace(/원\)|부\)|반\)/g,'')}</div>
    </div>
    <div class="prod-bttl">
      <div class="bttl-title">병목 자재 (Bottleneck)</div>
      <div class="bttl-name">${bottleneck.품명}</div>
      <div class="bttl-pno">${bottleneck.품번}</div>
      <div class="bttl-bar-wrap"><div class="bttl-bar" style="width:${Math.min(100,bottleneck.possible/Math.max(maxPossible,1)*100).toFixed(1)}%"></div></div>
      <div class="bttl-stat">현재고 <strong>${fn(bottleneck.stock)} ${bottleneck.단위}</strong></div>
      <div class="bttl-stat" style="margin-top:4px">소요량 <strong>${fn(bottleneck.qty)} ${bottleneck.단위}/포대</strong></div>
      <div class="bttl-stat" style="margin-top:4px;color:var(--red);font-weight:700">생산한계 <strong>${bottleneck.possible.toLocaleString()} 포대</strong></div>
    </div>`;

  // BOM cards
  const bomHtml=maxProd.map(b=>{
    const pct=maxPossible>0?Math.min(100,b.possible/maxPossible*100):0;
    const isBottleneck=b.possible===minPossible;
    const isWarn=b.possible<minPossible*1.5;
    const cls=isBottleneck?'btl':(isWarn?'warn':'ok');
    const badgeText=isBottleneck?'⚠ 병목':'충분';
    return `<div class="bom-card ${cls}">
      <div class="bc-top">
        <span class="bc-cat ${b.구분}">${b.구분}</span>
        <span class="bc-badge ${cls}">${badgeText}</span>
      </div>
      <div class="bc-pno">${b.품번}</div>
      <div class="bc-name">${b.품명}</div>
      <div class="bc-stats">
        <div class="bc-stat">
          <div class="bc-stat-label">현재고</div>
          <div class="bc-stat-val">${fn(b.stock)}</div>
        </div>
        <div class="bc-stat">
          <div class="bc-stat-label">소요량/포대</div>
          <div class="bc-stat-val">${fn(b.qty)}<span style="font-size:10px;font-weight:400;color:var(--tm)"> ${b.단위}</span></div>
        </div>
        <div class="bc-stat">
          <div class="bc-stat-label">생산가능</div>
          <div class="bc-stat-val ${cls==='btl'?'lo':'hi'}">${b.possible.toLocaleString()}</div>
        </div>
      </div>
      <div class="bc-prog">
        <div class="bc-prog-bar"><div class="bc-prog-fill ${cls}" style="width:${pct.toFixed(1)}%"></div></div>
        <div class="bc-prog-label"><span>${pct.toFixed(0)}%</span><span style="color:var(--acc)">${b.possible.toLocaleString()} 포대</span></div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('bomGrid').innerHTML=bomHtml;

  // Footer
  document.getElementById('ft-cnt').textContent=minPossible.toLocaleString()+' 포대';
  document.getElementById('ft-end').textContent='BOM 6종';
}

// ══ TABS ══
function switchTab(t){
  curTab=t;
  document.getElementById('tab-inv').classList.toggle('on',t==='inv');
  document.getElementById('tab-prod').classList.toggle('on',t==='prod');
  document.getElementById('view-inv').classList.toggle('on',t==='inv');
  document.getElementById('view-prod').classList.toggle('on',t==='prod');
  if(t==='inv'){
    document.getElementById('fbarLabel').textContent='셀 클릭으로 편집 가능 · 수정된 셀 노란색 표시';
    document.getElementById('ft-cnt').textContent=document.getElementById('vc').textContent;
    document.getElementById('ft-end').textContent=document.getElementById('ft-end').textContent;
    renderInv();
  } else {
    document.getElementById('fbarLabel').textContent='현재고 기준 · 전체 재고 합산 · ECO-ST2 1000kg 생산 예측';
    renderProd();
  }
}

// ══ FILE LOAD ══
function loadFile(e){
  const file=e.target.files[0];if(!file)return;
  const rd=new FileReader();
  rd.onload=function(ev){
    try{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      let hdr=-1;
      for(let i=0;i<raw.length;i++){if(raw[i].some(c=>String(c).includes('사업장'))){hdr=i;break;}}
      if(hdr<0){showT('헤더를 찾을 수 없습니다.','er');return;}
      const nd=[];
      for(let i=hdr+1;i<raw.length;i++){
        const r=raw[i];if(!r[0]||isNaN(Number(r[0])))continue;
        nd.push({no:String(r[0]),사업장:String(r[1]||'').trim(),창고:String(r[2]||'').trim(),장소:String(r[3]||'').trim(),
          품번:String(r[4]||'').trim(),품명:String(r[5]||'').trim(),재고단위:String(r[7]||'').trim(),
          기말재고:parseFloat(r[11])||0});
      }
      if(!nd.length){showT('데이터를 불러올 수 없습니다.','er');return;}
      D=nd;selLoc='all';sCol=-1;
      document.getElementById('mComp').textContent=D[0]?.사업장||'';
      buildLocGrid();renderInv();renderProd();
      showT(`✓ ${nd.length}건 로드 완료 : ${file.name}`,'ok');
    }catch(err){showT('파싱 오류: '+err.message,'er');}
  };
  rd.readAsArrayBuffer(file);e.target.value='';
}

// ══ UTILS ══
function fn(n){
  if(n===0||n===undefined)return'0';
  if(Math.abs(n)>=1e6)return(n/1e6).toFixed(3).replace(/\.?0+$/,'')+'M';
  return n.toLocaleString('ko-KR',{maximumFractionDigits:3});
}
function showT(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast on'+(type?' '+type:'');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),3000);
}

init();
</script>
