const tbody=document.getElementById('tbody');
let selBadge=null;

function buildContent(item){
const c=item.content;
let html=`<div class="sec"><p>${c.summary}</p></div>`;
c.sections.forEach(s=>{
html+=`<div class="sec"><div class="sec-title">${s.t}</div><div>${s.body}</div></div>`;
});
return html;
}

function showPanel(item){
const panel=document.getElementById('panel');
panel.innerHTML=`
<div class="phead">
<div class="ptitle">
<span class="badge ${item.cls}" style="cursor:default;border-color:transparent">${item.typeLabel}</span>
<span>${item.label}</span>
<a class="lawlink" href="${item.lawUrl}" target="_blank"><i class="ti ti-external-link" style="font-size:11px" aria-hidden="true"></i> law.go.kr 원문</a>
</div>
<button class="xbtn" id="xbtn" aria-label="닫기">&times;</button>
</div>
<div class="pbody">${buildContent(item)}</div>`;
document.getElementById('xbtn').addEventListener('click',()=>{
panel.innerHTML='<div class="ph"><i class="ti ti-file-description" style="font-size:18px" aria-hidden="true"></i><span>조항 배지를 클릭하면 내용이 여기에 표시됩니다</span></div>';
if(selBadge){selBadge.classList.remove('sel');selBadge=null;}
});
}

function render(cat){
tbody.innerHTML='';
DATA.forEach(row=>{
const show=cat==='전체'||row.cat===cat;
const tr=document.createElement('tr');
tr.className='cat-'+row.cat+(show?'':' hidden');
const td0=document.createElement('td');td0.className='topic';td0.textContent=row.topic;tr.appendChild(td0);
const cols={bl:[],bd:[],br:[],bt:[]};
row.items.forEach(it=>cols[it.cls].push(it));
['bl','bd','br','bt'].forEach(k=>{
const td=document.createElement('td');
if(!cols[k].length){td.innerHTML='<span class="na">—</span>';}
else cols[k].forEach(it=>{
const b=document.createElement('span');
b.className='badge '+it.cls;
b.textContent=it.label;
b.title='클릭하여 내용 보기';
b.addEventListener('click',()=>{
if(selBadge)selBadge.classList.remove('sel');
b.classList.add('sel');
selBadge=b;
showPanel(it);
});
td.appendChild(b);
});
tr.appendChild(td);
});
tbody.appendChild(tr);
});
}

document.getElementById('filters').addEventListener('click',e=>{
const btn=e.target.closest('.fbtn');
if(!btn)return;
document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
render(btn.dataset.cat);
});
render('전체');
</script>
